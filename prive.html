<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prive - L'Ambassador School</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1a1a1a 0%, #0d0d0d 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            font-family: 'Georgia', serif;
        }

        h1 {
            color: #c9a227;
            margin-bottom: 40px;
            font-weight: 300;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .slideshow-container {
            position: relative;
            width: 80vw;
            max-width: 900px;
            height: 60vh;
            max-height: 600px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-radius: 4px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .slide {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
        }

        .slide.active {
            opacity: 1;
        }

        .indicators {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }

        .indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(201, 162, 39, 0.3);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .indicator.active {
            background: #c9a227;
            transform: scale(1.2);
        }

        .indicator:hover {
            background: rgba(201, 162, 39, 0.6);
        }

        .controls {
            margin-top: 30px;
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .control-btn {
            background: transparent;
            border: 1px solid #c9a227;
            color: #c9a227;
            padding: 12px 30px;
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Georgia', serif;
        }

        .control-btn:hover {
            background: #c9a227;
            color: #0d0d0d;
        }

        .nav-btn {
            background: transparent;
            border: 1px solid #c9a227;
            color: #c9a227;
            width: 50px;
            height: 50px;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-btn:hover {
            background: #c9a227;
            color: #0d0d0d;
        }

        .back-link {
            margin-top: 50px;
            color: #c9a227;
            text-decoration: none;
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            border: 1px solid #c9a227;
            padding: 12px 30px;
            transition: all 0.3s ease;
        }

        .back-link:hover {
            background: #c9a227;
            color: #0d0d0d;
        }
    </style>
</head>
<body>
    <h1>Prive</h1>

    <div class="slideshow-container">
        <img src="Prive/1.jpg" alt="Slide 1" class="slide active">
        <img src="Prive/2.jpg" alt="Slide 2" class="slide">
        <img src="Prive/3.jpg" alt="Slide 3" class="slide">
    </div>

    <div class="indicators">
        <div class="indicator active" data-index="0"></div>
        <div class="indicator" data-index="1"></div>
        <div class="indicator" data-index="2"></div>
    </div>

    <div class="controls">
        <button class="nav-btn" id="prevBtn">&#8249;</button>
        <button class="control-btn" id="playPauseBtn">Pause</button>
        <button class="nav-btn" id="nextBtn">&#8250;</button>
    </div>

    <a href="index.html" class="back-link">Back to Home</a>

    <script>
        const slides = document.querySelectorAll('.slide');
        const indicators = document.querySelectorAll('.indicator');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');

        let currentSlide = 0;
        let isPlaying = true;
        let intervalId;
        const speed = 4000;

        function showSlide(index) {
            slides[currentSlide].classList.remove('active');
            indicators[currentSlide].classList.remove('active');

            currentSlide = index;
            if (currentSlide >= slides.length) currentSlide = 0;
            if (currentSlide < 0) currentSlide = slides.length - 1;

            slides[currentSlide].classList.add('active');
            indicators[currentSlide].classList.add('active');
        }

        function nextSlide() {
            showSlide(currentSlide + 1);
        }

        function prevSlide() {
            showSlide(currentSlide - 1);
        }

        function startSlideshow() {
            intervalId = setInterval(nextSlide, speed);
        }

        function stopSlideshow() {
            clearInterval(intervalId);
        }

        playPauseBtn.addEventListener('click', () => {
            if (isPlaying) {
                stopSlideshow();
                playPauseBtn.textContent = 'Play';
            } else {
                startSlideshow();
                playPauseBtn.textContent = 'Pause';
            }
            isPlaying = !isPlaying;
        });

        prevBtn.addEventListener('click', () => {
            prevSlide();
            if (isPlaying) {
                stopSlideshow();
                startSlideshow();
            }
        });

        nextBtn.addEventListener('click', () => {
            nextSlide();
            if (isPlaying) {
                stopSlideshow();
                startSlideshow();
            }
        });

        indicators.forEach((indicator, index) => {
            indicator.addEventListener('click', () => {
                showSlide(index);
                if (isPlaying) {
                    stopSlideshow();
                    startSlideshow();
                }
            });
        });

        // Start the slideshow
        startSlideshow();
    </script>
</body>
</html>
