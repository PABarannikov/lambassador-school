<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horse Animation - L'Ambassador School</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1a1a1a 0%, #0d0d0d 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            font-family: 'Georgia', serif;
        }

        h1 {
            color: #c9a227;
            margin-bottom: 40px;
            font-weight: 300;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .frames-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            max-width: 1400px;
        }

        .frame {
            width: 150px;
            height: 150px;
            object-fit: contain;
            animation: slowRotate var(--duration) linear infinite;
            animation-delay: var(--delay);
            filter: drop-shadow(0 0 10px rgba(201, 162, 39, 0.3));
            transition: transform 0.3s ease;
        }

        .frame:hover {
            animation-play-state: paused;
            transform: scale(1.5);
            z-index: 10;
        }

        @keyframes slowRotate {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        .back-link {
            margin-top: 50px;
            color: #c9a227;
            text-decoration: none;
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            border: 1px solid #c9a227;
            padding: 12px 30px;
            transition: all 0.3s ease;
        }

        .back-link:hover {
            background: #c9a227;
            color: #0d0d0d;
        }
    </style>
</head>
<body>
    <h1>L'Ambassador School</h1>

    <div class="frames-container">
